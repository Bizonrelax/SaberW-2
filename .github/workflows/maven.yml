name: Build Portable Windows Package (Java 21 per ТЗ)

# Сборка по требованию (workflow_dispatch), при пуше в main и pull request'ах.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Windows нужен для корректной работы Launch4j (формирование EXE-заголовка).
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'   # ТЗ требует Java 21+ — см. Docs/Техническое Задание/Основное/ТЗ.md, п.1
        distribution: 'temurin'
        cache: maven

    - name: Export project version from pom
      # Формируем тег/имя релиза из версии pom (v${project.version}).
      shell: bash
      run: |
        VER=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:3.5.0:exec 2>/dev/null || true)
        if [ -z "$VER" ]; then VER=$(awk '/<version>/{gsub(/.*<version>|<\/version>.*/,""); print; exit}' pom.xml); fi
        echo "PROJECT_VERSION=$VER" >> "$GITHUB_ENV"

    - name: Build with Maven (JAR + EXE через launch4j-maven-plugin)
      run: mvn -B package --file pom.xml

    - name: Download bundled Temurin JRE 21 (Windows x64)
      # Официальная легкая сборка JRE — вкладывается в архив, чтобы EXE запускался без установленной Java.
      shell: bash
      run: |
        curl -sSL -o jre.zip "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
        unzip -q jre.zip -d target/
        mv target/jdk-21* target/jre

    - name: Assemble portable package (exe + jar + jre)
      shell: bash
      run: |
        mkdir -p dist
        cp target/SaberW-2.exe dist/
        cp target/*.jar dist/ || true
        cp -r target/jre dist/jre

    - name: Upload portable application package
      # Артефакт Actions: внутри EXE, JAR и папка jre. EXE ищет jre рядом с собой — запускается везде.
      uses: actions/upload-artifact@v4
      with:
        name: SaberW2-portable-win64
        path: dist/
        if-no-files-found: error

    - name: Create/Update GitHub Release (только для main)
      # Бинарники хранятся «в репозитории» — в разделе Releases.
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      continue-on-error: true   # если не хватает прав на Release — сборка всё равно успешна, артефакт загружен
      uses: softprops/action-gh-release@v2
      id: release
      with:
        tag_name: v${{ env.PROJECT_VERSION }}
        name: SaberW 2 v${{ env.PROJECT_VERSION }}
        body: Автоматическая сборка portable-пакета (EXE + JAR + встроенная Temurin JRE 21) для Windows x64.
        files: |
          dist/SaberW-2.exe
          dist/*.jar
        fail_on_unmatched_files: false
        overwrite_files: true    # при каждом пуше в main бинарники в Release перезаписываются свежими
        make_latest: true        # тег latest всегда указывает на последнюю успешную сборку
        # Для публикации Release нужен отдельный секрет RELEASE_PAT (fine-grained PAT владельца
        # с разрешением Contents: Read and write). Дефолтный GITHUB_TOKEN не может создавать
        # релизы при push-событиях (403 Resource not accessible by integration); при pull_request
        # и workflow_dispatch событий он может — но там шаг пропускается, чтобы не плодить
        # релизы/теги v0.2.0-SNAPSHOT из PR-веток.
        token: ${{ secrets.RELEASE_PAT }}

    - name: Publish release via API (fallback, если нет RELEASE_PAT)
      # Дефолтный GITHUB_TOKEN умеет создавать релизы при push с разрешением contents: write.
      if: |
        always() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
        steps.release.outcome != 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        TAG="v${PROJECT_VERSION}"
        BODY="Автоматическая сборка portable-пакета (EXE + JAR + встроенная Temurin JRE 21) для Windows x64."
        # создать релиз (если уже есть — использовать существующий)
        curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/releases" \
          -d "{\"tag_name\":\"$TAG\",\"name\":\"SaberW 2 $TAG\",\"body\":\"$BODY\",\"make_latest\":\"true\"}" >/dev/null \
          || echo "release already exists or create failed"
        RID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | grep -m1 '"id"' | tr -dc '0-9')
        [ -n "$RID" ] || { echo "no release id"; exit 1; }
        for f in dist/SaberW-2.exe dist/*.jar; do
          [ -f "$f" ] || continue
          NAME=$(basename "$f")
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary "@$f" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=$NAME" >/dev/null \
            || echo "upload skipped/failed: $NAME"
        done
        curl -sf -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/releases/$RID" \
          -d '{"make_latest":"true"}' >/dev/null || true
