name: Build Portable Windows Package (Java 21 per ТЗ, jpackage)

# Сборка по требованию (workflow_dispatch), при пуше в main и pull request'ах.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # создание/обновление Release дефолтным GITHUB_TOKEN (v4+ умеет)

jobs:
  build:
    # Windows нужен для корректной работы jpackage (формирование app-image под Windows).
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4          # v4 — убран варнинг "Node.js 20 is deprecated"

    - name: Set up JDK 21 (Temurin)
      uses: actions/setup-java@v4        # v4 — актуальная версия без Node 20
      with:
        java-version: '21'   # ТЗ требует Java 21+ — см. Docs/Техническое Задание/Основное/ТЗ.md, п.1
        distribution: 'temurin'

    - name: Cache Maven repository (~/.m2/repository)
      # Явный кэш вместо cache: maven у setup-java — ключ содержит hashFiles('**/pom.xml'),
      # restore-keys — префикс без хэша (устойчивый partial restore, чинит «Failed to restore cache»).
      uses: actions/cache@v4             # v4 — актуальная версия без Node 20
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Export project version from pom
      # Формируем тег/имя релиза из версии pom (v${project.version}).
      shell: bash
      run: |
        VER=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:3.5.0:exec 2>/dev/null || true)
        if [ -z "$VER" ]; then VER=$(awk '/<version>/{gsub(/.*<version>|<\/version>.*/,""); print; exit}' pom.xml); fi
        echo "PROJECT_VERSION=$VER" >> "$GITHUB_ENV"

    - name: Build with Maven (tests + JAR)
      # Launch4j удалён из pom.xml (устаревший, см. "Психология кодера-Гвен.md") —
      # mvn package собирает только JAR; EXE/app-image делает jpackage ниже.
      run: mvn -B package --file pom.xml

    - name: Resolve jar name
      shell: bash
      run: echo "MAIN_JAR=$(ls target/*.jar | head -1 | xargs basename)" >> "$GITHUB_ENV"

    - name: Package with jpackage (app-image, portable Windows build)
      # Замена launch4j: jpackage из JDK 21 создаёт автономный app-image
      # (SaberW-2.exe + JVM внутри) без внешних плагинов.
      shell: pwsh
      run: |
        jpackage --type app-image --input target --main-jar $env:MAIN_JAR `
          --main-class com.saberw.gui.MainWindow --name "SaberW 2" --dest target/jpackage-out

    - name: Assemble portable ZIP
      # Упаковываем папку app-image в один portable-архив для Release.
      shell: pwsh
      run: |
        Compress-Archive -Path "target/jpackage-out/SaberW 2" `
          -DestinationPath "target/SaberW-2-portable.zip" -Force

    - name: Upload portable application package
      # Артефакт Actions: ZIP с app-image (exe + jar + встроенная runtime-джангл).
      uses: actions/upload-artifact@v4   # v4 — актуальная версия без Node 20
      with:
        name: SaberW2-portable-win64-zip
        path: target/SaberW-2-portable.zip
        if-no-files-found: error

    - name: Create/Update GitHub Release (только для main push)
      # Исправление сломанного gh release upload: артефакт передаётся напрямую
      # в softprops/action-gh-release через files:.
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      continue-on-error: true   # если не хватает прав на Release — сборка всё равно успешна, артефакт загружен
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.PROJECT_VERSION }}
        name: SaberW 2 v${{ env.PROJECT_VERSION }}
        body: Автоматическая сборка portable-пакета (jpackage app-image, Windows x64, Temurin JRE 21).
        files: target/SaberW-2-portable.zip
        fail_on_unmatched_files: false
        overwrite_files: true    # при каждом пуше в main бинарники в Release перезаписываются свежими
        make_latest: true        # тег latest всегда указывает на последнюю успешную сборку
