name: Build Portable Windows Package (Java 21 per ТЗ)

# Сборка по требованию (workflow_dispatch), при пуше в main и pull request'ах.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # создание/обновление Release и тегов дефолтным GITHUB_TOKEN
  actions: read     # управление артефактами Actions (варнинг insufficient permissions)
  checks: write     # публикация результатов проверок

jobs:
  build:
    # Windows нужен для сборки портативного EXE через jpackage (app-image).
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'   # ТЗ требует Java 21+ — см. Docs/Техническое Задание/Основное/ТЗ.md, п.1
        distribution: 'temurin'

    - name: Cache Maven repository (~/.m2/repository)
      # Явный кэш вместо cache: maven у setup-java — ключ содержит hashFiles('**/pom.xml'),
      # restore-keys — префикс без хэша (устойчивый partial restore, чинит «Failed to restore cache»).
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Export project version from pom
      # Формируем тег/имя релиза из версии pom (v${project.version}).
      shell: bash
      run: |
        VER=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:3.5.0:exec 2>/dev/null || true)
        if [ -z "$VER" ]; then VER=$(awk '/<version>/{gsub(/.*<version>|<\/version>.*/,""); print; exit}' pom.xml); fi
        echo "PROJECT_VERSION=$VER" >> "$GITHUB_ENV"

    - name: Build with Maven (JAR, тесты)
      run: mvn -B package --file pom.xml

    - name: Package portable EXE via jpackage per TZ
      shell: bash
      run: |
        JAR=$(basename target/SaberW-2-*.jar | head -n1)
        jpackage --type app-image --name SaberW-2 \
          --main-jar "$JAR" \
          --main-class com.saberw.gui.MainWindow \
          --input target \
          --dest target/jpackage-out

    - name: Archive portable package
      shell: bash
      run: |
        cd target/jpackage-out
        7z a -tzip ../../SaberW-2-portable-win64.zip SaberW-2
        cd ../..

    - name: Upload portable application package
      # Артефакт Actions: zip с app-image (SaberW-2.exe + встроенная JRE из JDK раннера).
      uses: actions/upload-artifact@v4
      with:
        name: SaberW2-portable-win64
        path: SaberW-2-portable-win64.zip
        if-no-files-found: error

    - name: Create/Update GitHub Release (только для main)
      # Бинарники хранятся «в репозитории» — в разделе Releases.
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      continue-on-error: true   # если не хватает прав на Release — сборка всё равно успешна, артефакт загружен
      uses: softprops/action-gh-release@v2
      id: release
      with:
        tag_name: v${{ env.PROJECT_VERSION }}
        name: SaberW 2 v${{ env.PROJECT_VERSION }}
        body: "Автоматическая сборка portable-пакета через jpackage (app-image: EXE + встроенная JRE 21) для Windows x64."
        files: |
          SaberW-2-portable-win64.zip
        fail_on_unmatched_files: false
        overwrite_files: true    # при каждом пуше в main бинарники в Release перезаписываются свежими
        make_latest: true        # тег latest всегда указывает на последнюю успешную сборку
        # Для публикации Release нужен отдельный секрет RELEASE_PAT (fine-grained PAT владельца
        # с разрешением Contents: Read and write). Дефолтный GITHUB_TOKEN не может создавать
        # релизы при push-событиях (403 Resource not accessible by integration); при pull_request
        # и workflow_dispatch событий он может — но там шаг пропускается, чтобы не плодить
        # релизы/теги v0.2.0-SNAPSHOT из PR-веток.

    - name: Verify release assets (main push only)
      # Финальная проверка: softprops/action-gh-release выше уже создал релиз v<версия>
      # и загрузил в него SaberW-2-portable-win64.zip (overwrite_files, make_latest).
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="v${PROJECT_VERSION}"
        gh release view "$TAG"
        ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
        echo "$ASSETS"
        echo "$ASSETS" | grep -q '^SaberW-2-portable-win64\.zip$' || { echo "missing portable zip asset"; exit 1; }
