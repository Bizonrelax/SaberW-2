name: Build Portable Windows EXE (Java 17)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Download Portable JRE 17 for Windows
      # Скачиваем официальную легкую сборку JRE для встраивания в архив
      run: |
        curl -L -o jre.zip https://github.com
        tar -xf jre.zip
        mv jdk-17.0.10+7-jre target/jre

    - name: Upload Portable Application Package
      # Загружаем архив, где лежит EXE и папка jre. При такой структуре EXE запустится везде!
      uses: actions/upload-artifact@v4
      with:
        name: Portable-SaberW2-Java17
        path: |
          target/SaberW-2.exe
          target/jre/
